name: BOM Sync Check

on:
  pull_request:
    paths:
      - "bom/**"
      - "docs/BOM.md"
      - "scripts/gen_bom.py"
      - ".github/workflows/bom-check.yml"

jobs:
  check-bom:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyYAML
        run: pip install pyyaml

      - name: Verify BOM tables and CSV are up to date
        run: python3 scripts/gen_bom.py --check
